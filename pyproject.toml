[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aapl-10q-rag"
version = "0.1.0"
description = "RAG question-answering app over Apple's 2022 Q3 10-Q filing"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "google-genai>=0.1",
    "docling>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.30",
    "pymupdf>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    "numpy>=1.26",
    "rank_bm25>=0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
